server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/power_inspection?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8

app:
  image-dir: ./resourece/image
  base-url: http://localhost:8081
  jwt-secret: powerinspectionspringbootjwtsecretkey2026
  jwt-expire-hours: 24
