server:
  port: 8080

spring:
  application:
    name: charging-platform-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/charging_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.charging.platform: info

# 默认关闭自动模拟，避免演示数据自行变化；后台工作台仍可手动执行一次。
# 需要定时模拟时可设置环境变量 SIMULATION_ENABLED=true。
simulation:
  enabled: ${SIMULATION_ENABLED:false}
  initial-delay-ms: 60000
  fixed-delay-ms: 900000
  statistics-cron: "0 10 0 * * ?"
