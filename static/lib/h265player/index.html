<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible"
        content="IE=edge">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Document1</title>
  <style>
    p {
      margin: 0;
      padding: 0;
    }
    h1,h3{
      margin: 0;
    }

    input {
      height: 40px;
      margin: 20px 0;
    }

    .videos {
      width: 1000px;
      height: 562px;
      /* border: 1px solid #333; */
    }

    .info {
      display: flex;
      background-color: rgba(46, 39, 39, 0.8);
      position: relative;
      top: -65px;
    }

    .videos p {
      width: 100%;
      color: red;
      line-height: 60px;
      padding: 0 10px;
      font-size: 22px;

    }

    .videos span {
      width: 60px;
      text-align: right;
      z-index: 1;
      line-height: 60px;
      cursor: pointer;
      padding: 0 20px;
      color: white;
      font-size: 22px;
    }

    #player {
      width: 1000px;
      height: 562px;
    }
    #videosMSE{
      display: none;
    }
    #canvas{
      width: 1000px;
      height: 562px;
      /* display: none; */
    }
    #infoFPS{
      margin: 10px 0 10px 0;
      color: red;
    }
  </style>
</head>

<body style="width: 100%; height: 100%;">
  <h1 style="margin: 0 auto; width: 100%; height: 70px; text-align: center;margin-top: 20px;">MSE视频测试工具</h1>
  <h3 style="color:red; font-size:20px;">操作播放停止按钮时需要间隔1s左右时间</h3>
  <h3 style="color:red; font-size:20px;">直播模式下号码为终端号码  如:13500001102</h3>
  <h3 style="color:red; font-size:20px;">监控模式下号码为协转主消息号码*监控ID 如:13500001028*4</h3>

  <span>请输入ip号：</span><input type="text"
         placeholder="请输入ip地址"
         value="ws://192.168.109.214:8908"
         id="ip">
  <select name="select_id" id="select_id"   editable='false' style="width:150px;height:46px">
    <option value="2" >监控</option>
    <option value="1" >直播</option>

  </select>
  <span>请输入号码：</span><input type="text"
         placeholder="请输入号码"
         value="10800009169*537456"
         id="agree">
  <span>请输入应用编码：</span><input type="text"
         placeholder="请输入应用编码"
         value="A88880000000233333308888888"
         id="token">

  <button onclick="play('ip','agree','token','select_id')">播放</button>
  <button onclick="stop('ip','agree','token','select_id')">停止</button>
  <div class="playWindow">
    <div id="infoFPS"></div>
    <!-- autoplay 自动播放// muted静音模式  google防止突如其来的声音，所以 如果不设置 muted 静音 autopaly 自动播放不会播放 -->
    <div class="videos" id="videosMSE" >
      <video autoplay
            id="player"></video>
      <div class="info">
        <p id="tess"></p>
        <span onclick="full()">全屏</span>
      </div>
    </div>
    <!-- h265播放 -->
    <canvas id="canvas" class='draw-gl' width="1280" height="720"></canvas>

  </div>


	<script src="./example-dist.js"></script>
  <script src="./media.js"></script>
  <script src="./jquery.js"></script>
  <script>
    $('.info').hide()
    $('#player').hover(function () {
      // if (stat) {
        $('.info').show()
      // }
    }, function () {
      $('.info').hide()
    })
    $('.info').hover(function () {
      // if (stat) {
        $('.info').show()
      // }
    }, function () {
      $('.info').hide()
    })
    function full() {
      var de = document.getElementById('player');
      if (de.requestFullscreen) {
        de.requestFullscreen();
      } else if (de.mozRequestFullScreen) {
        de.mozRequestFullScreen();
      } else if (de.webkitRequestFullScreen) {
        de.webkitRequestFullScreen();
      }
    }
  </script>
</body>

</html>
